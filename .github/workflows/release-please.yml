name: release-please

on:
  push:
    branches:
      - main

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  # main's action.yml always points at the ':latest' image; release/vN
  # branches pin action.yml to the exact released version so that the
  # floating `@vX` / `@vX.Y` tags resolve to a reproducible image instead
  # of drifting with 'latest'. This job reproduces what
  # scripts/create-release.sh used to do by hand, but driven by
  # release-please's version instead of a manual prompt.
  #
  # The exact-version tag ($FULL, e.g. v1.4.0) is left untouched here —
  # it's created by release-please pointing at the release commit on
  # main. Moving it onto the release branch made it unreachable from
  # main's history, which broke release-please's own "commits since last
  # release" bookkeeping: it could no longer find the last release tag as
  # an ancestor of main, so every subsequent run treated the entire
  # history as unreleased (see #24).
  pin-release-branch:
    name: Pin release branch and move tags
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Pin action.yml on the release branch and move tags
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          VERSION="${TAG#v}"
          MAJOR="v${VERSION%%.*}"
          MINOR="v${VERSION%.*}"
          FULL="v${VERSION}"
          RELEASE_BRANCH="release/${MAJOR}"

          git checkout -B "$RELEASE_BRANCH"

          sed -i "s|docker://ghcr.io/vln-devsecops/actions-validate-coverage:[^'\"]*|docker://ghcr.io/vln-devsecops/actions-validate-coverage:${VERSION}|g" action.yml
          git add action.yml
          git diff --cached --quiet || git commit -m "chore: pin action.yml to ${FULL}"

          git push origin "$RELEASE_BRANCH" --force

          git tag -fa "$MAJOR" -m "Release $FULL"
          git tag -fa "$MINOR" -m "Release $FULL"
          git push origin "refs/tags/$MAJOR" "refs/tags/$MINOR" --force

  # Build, test and publish the release-tagged image to GHCR.
  #
  # This has to happen in *this* workflow run: pin-release-branch moves the
  # release tags with the default GITHUB_TOKEN, and GitHub does not trigger an
  # `on: push: tags` workflow from a GITHUB_TOKEN push. Relying on a tag-push
  # trigger is exactly why automated releases stopped publishing their image.
  tag-image:
    name: Build and promote release image
    needs: [release-please, pin-release-branch]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_promote_image.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
