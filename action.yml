name: 'Validate Coverage'
description: 'Validate test coverage from XML files against minimum thresholds'
author: 'Vlinder Software'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  coverage-file:
    description: 'Path to the coverage XML file (e.g., coverage/cobertura.xml)'
    required: true
  minimum-coverage:
    description: 'Minimum coverage percentage required (e.g., 85)'
    required: true
    default: '85'
  coverage-type:
    description: 'Type of coverage XML format (clover, cobertura, jacoco). The default is applied regardless of the coverage file''s name or extension, so a file named clover.xml is still parsed as Cobertura unless this is set.'
    required: false
    default: 'cobertura'
  working-directory:
    description: 'Working directory where the coverage file is located'
    required: false
    default: '.'
  github-token:
    description: 'Token used to publish a commit status with the coverage result (typically the workflow''s github.token). Requires the statuses: write permission, which a workflow declaring an explicit permissions block must list explicitly. Omit to skip status publishing entirely — the action behaves exactly as before.'
    required: false
  status-context:
    description: 'Commit status context to publish under. Must start with "coverage" to be picked up by the org dashboard.'
    required: false
    default: 'coverage/validate-coverage'
  json-report-file:
    description: 'Path to write a machine-readable JSON coverage report (relative to working-directory), for dashboards in other orgs that consume a workflow artifact instead of a commit status. Omit to skip report-file generation — the report-json output is still produced.'
    required: false
    default: ''

outputs:
  coverage-percentage:
    description: 'The actual coverage percentage found'
  status:
    description: 'Pass or fail status of the validation'
  report-json:
    description: 'A compact JSON string summarizing the coverage report (coverageFile, coverageType, coveragePercentage, minimumCoverage, status, covered, total, timestamp)'
  report-file:
    description: 'Path to the written JSON report file, relative to $GITHUB_WORKSPACE when the report lives under it (falls back to an absolute container path otherwise) so it can be used directly by later steps like actions/upload-artifact. Only set when json-report-file is provided and the write succeeds'

runs:
  using: 'docker'
  # VERSIONING STRATEGY:
  # - Main branch: Always use 'latest' for continuous updates
  # - Release branches: Pin to specific version (e.g., '1.0.14' without 'v' prefix)
  image: 'docker://ghcr.io/vln-devsecops/actions-validate-coverage:1.4.2'
  args:
    - ${{ inputs.coverage-file }}
    - ${{ inputs.minimum-coverage }}
    - ${{ inputs.coverage-type }}
    - ${{ inputs.working-directory }}
    - ${{ inputs.json-report-file }}
  env:
    STATUS_TOKEN: ${{ inputs.github-token }}
    STATUS_CONTEXT: ${{ inputs.status-context }}
