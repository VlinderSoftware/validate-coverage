name: 'Validate Coverage'
description: 'Validate test coverage from XML files against minimum thresholds'
author: 'Vlinder Software'

branding:
  icon: 'check-circle'
  color: 'green'

inputs:
  coverage-file:
    description: 'Path to the coverage XML file (e.g., coverage/cobertura.xml)'
    required: true
  minimum-coverage:
    description: 'Minimum coverage percentage required (e.g., 85)'
    required: true
    default: '85'
  coverage-type:
    description: 'Type of coverage XML format (clover, cobertura, jacoco)'
    required: false
    default: 'cobertura'
  working-directory:
    description: 'Working directory where the coverage file is located'
    required: false
    default: '.'
  json-report-file:
    description: 'Path to write a machine-readable JSON coverage report, for dashboard consumption (relative to working-directory)'
    required: false
    default: ''

outputs:
  coverage-percentage:
    description: 'The actual coverage percentage found'
  status:
    description: 'Pass or fail status of the validation'
  report-json:
    description: 'A compact JSON string summarizing the coverage report, for machine consumption'
  report-file:
    description: 'Path to the JSON report file (only set when json-report-file is provided)'

runs:
  using: 'docker'
  # VERSIONING STRATEGY:
  # - Main branch: Always use 'latest' for continuous updates
  # - Release branches: Pin to specific version (e.g., '1.0.14' without 'v' prefix)
  image: 'docker://ghcr.io/vln-devsecops/actions-validate-coverage:latest'
  args:
    - ${{ inputs.coverage-file }}
    - ${{ inputs.minimum-coverage }}
    - ${{ inputs.coverage-type }}
    - ${{ inputs.working-directory }}
    - ${{ inputs.json-report-file }}
